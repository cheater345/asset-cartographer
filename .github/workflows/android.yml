name: android

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub runners ship the Android SDK preinstalled. The third-party
      # setup-android action now fails because Google removed the legacy
      # "tools" package it tries to install, so we skip it and only top up
      # missing components, best effort.
      - name: Ensure Android SDK components (best effort)
        continue-on-error: true
        run: |
          SM="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          if [ -x "$SM" ]; then
            yes | "$SM" --licenses > /dev/null 2>&1 || true
            "$SM" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asset-cartographer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
